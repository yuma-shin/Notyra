name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Create tag and release draft
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      release-id: ${{ steps.release.outputs.release-id }}

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Validate version, create tag and release draft
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const pr = context.payload.pull_request;
            const match = /^release\/v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))$/.exec(pr.head.ref);
            if (!match) {
              throw new Error('Release branch must be named release/vX.Y.Z');
            }
            const version = match[1];
            const tag = `v${version}`;
            for (const file of ['package.json', 'src-tauri/tauri.conf.json']) {
              const actual = JSON.parse(fs.readFileSync(file, 'utf8')).version;
              if (actual !== version) {
                throw new Error(`${file}: expected ${version}, got ${actual}`);
              }
            }

            const repo = context.repo;
            const sha = pr.merge_commit_sha;
            let existingTag;
            try {
              existingTag = await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existingTag) {
              if (existingTag.data.object.type !== 'commit' || existingTag.data.object.sha !== sha) {
                throw new Error(`${tag} already points to a different commit`);
              }
            } else {
              await github.rest.git.createRef({ ...repo, ref: `refs/tags/${tag}`, sha });
            }

            // List releases to include drafts when retrying a failed build.
            const releases = await github.paginate(github.rest.repos.listReleases, { ...repo, per_page: 100 });
            let release = releases.find(item => item.tag_name === tag);
            if (release && !release.draft) {
              throw new Error(`${tag} is already published; refusing to replace release assets`);
            }
            if (!release) {
              const response = await github.rest.repos.createRelease({
                ...repo,
                tag_name: tag,
                target_commitish: sha,
                name: `Notyra ${tag}`,
                body: 'See the assets below to download Notyra for your platform.',
                draft: true,
                prerelease: false,
              });
              release = response.data;
            }
            core.setOutput('tag', tag);
            core.setOutput('release-id', String(release.id));

  # ------------------------------------------------------------------
  # macOS ビルド
  # ------------------------------------------------------------------
  release-macos:
    needs: prepare-release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and publish (universal macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release-id }}
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin

      - name: Create and upload macOS ZIP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          DMG_FILE="${GITHUB_WORKSPACE}/src-tauri/target/universal-apple-darwin/release/bundle/dmg/Notyra_${VERSION}_universal.dmg"
          ZIP_NAME="Notyra_${VERSION}_universal.zip"

          # DMG をマウントして .app を取り出す（Tauri は DMG 作成後に .app を削除するため）
          MOUNT_POINT=$(mktemp -d)
          hdiutil attach "${DMG_FILE}" -mountpoint "${MOUNT_POINT}" -nobrowse -quiet

          APP_FILE=$(find "${MOUNT_POINT}" -maxdepth 1 -type d -name "*.app" | head -1)
          if [ -z "$APP_FILE" ]; then
            echo "ERROR: No .app found in DMG"
            ls -la "${MOUNT_POINT}" || true
            hdiutil detach "${MOUNT_POINT}" -quiet || true
            exit 1
          fi

          ditto -c -k --keepParent "${APP_FILE}" "${GITHUB_WORKSPACE}/${ZIP_NAME}"
          hdiutil detach "${MOUNT_POINT}" -quiet

          gh release upload "${RELEASE_TAG}" "${ZIP_NAME}" --clobber

  # ------------------------------------------------------------------
  # Windows ビルド
  # ------------------------------------------------------------------
  release-windows:
    needs: prepare-release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release-id }}
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseDraft: true
          prerelease: false

      - name: Create and upload Windows portable and ZIP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $tagName = $env:RELEASE_TAG

          # ポータブル版: ビルド済みバイナリをそのまま配布
          $portableName = "Notyra_${version}_x64-portable.exe"
          Copy-Item "src-tauri\target\release\notyra.exe" $portableName

          # ZIP版: ポータブルバイナリを圧縮
          $zipName = "Notyra_${version}_x64.zip"
          Compress-Archive -Path $portableName -DestinationPath $zipName

          gh release upload $tagName $portableName $zipName --clobber

  # ------------------------------------------------------------------
  # Linux ビルド
  # ------------------------------------------------------------------
  release-linux:
    needs: prepare-release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release-id }}
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseDraft: true
          prerelease: false
