name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # macOS ビルド
  # ------------------------------------------------------------------
  release-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 12.4.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Build and publish (universal macOS)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Notyra ${{ github.ref_name }}"
          releaseBody: "See the assets below to download Notyra for your platform."
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin

      - name: Create and upload macOS ZIP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          DMG_FILE="${GITHUB_WORKSPACE}/src-tauri/target/universal-apple-darwin/release/bundle/dmg/Notyra_${VERSION}_universal.dmg"
          ZIP_NAME="Notyra_${VERSION}_universal.zip"

          # DMG をマウントして .app を取り出す（Tauri は DMG 作成後に .app を削除するため）
          MOUNT_POINT=$(mktemp -d)
          hdiutil attach "${DMG_FILE}" -mountpoint "${MOUNT_POINT}" -nobrowse -quiet

          APP_FILE=$(find "${MOUNT_POINT}" -maxdepth 1 -type d -name "*.app" | head -1)
          if [ -z "$APP_FILE" ]; then
            echo "ERROR: No .app found in DMG"
            ls -la "${MOUNT_POINT}" || true
            hdiutil detach "${MOUNT_POINT}" -quiet || true
            exit 1
          fi

          ditto -c -k --keepParent "${APP_FILE}" "${GITHUB_WORKSPACE}/${ZIP_NAME}"
          hdiutil detach "${MOUNT_POINT}" -quiet

          gh release upload "${{ github.ref_name }}" "${ZIP_NAME}" --clobber

  # ------------------------------------------------------------------
  # Windows ビルド
  # ------------------------------------------------------------------
  release-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 12.4.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Build and publish
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Notyra ${{ github.ref_name }}"
          releaseBody: "See the assets below to download Notyra for your platform."
          releaseDraft: true
          prerelease: false

      - name: Create and upload Windows portable and ZIP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $tagName = "${{ github.ref_name }}"

          # ポータブル版: ビルド済みバイナリをそのまま配布
          $portableName = "Notyra_${version}_x64-portable.exe"
          Copy-Item "src-tauri\target\release\notyra.exe" $portableName

          # ZIP版: ポータブルバイナリを圧縮
          $zipName = "Notyra_${version}_x64.zip"
          Compress-Archive -Path $portableName -DestinationPath $zipName

          gh release upload $tagName $portableName $zipName --clobber

  # ------------------------------------------------------------------
  # Linux ビルド（macOS/Windows のドラフト作成完了後に実行）
  # ------------------------------------------------------------------
  release-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-macos, release-windows]
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 12.4.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Build and publish
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Notyra ${{ github.ref_name }}"
          releaseBody: "See the assets below to download Notyra for your platform."
          releaseDraft: true
          prerelease: false
