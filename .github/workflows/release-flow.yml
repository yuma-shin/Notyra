name: Release Flow

on:
  push:
    branches:
      - 'release/**'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      # Gitユーザー設定
      - name: Configure git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      # release/v1.2.3 → v1.2.3 を抽出
      - name: Extract version
        id: version
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          VERSION=${BRANCH#release/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # mainへのPR作成
      - name: Create PR to main
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head release/${{ steps.version.outputs.version }} \
            --title "Release ${{ steps.version.outputs.version }}" \
            --body "Automated release PR")
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      # PR反映待機
      - name: Wait for PR to be ready
        run: sleep 10

      # mainへのPRをマージ
      - name: Merge PR to main
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          gh pr merge ${{ steps.create_pr.outputs.pr_url }} --merge --admin

      # mainにタグを付与
      - name: Create tag
        run: |
          git fetch origin main
          git tag ${{ steps.version.outputs.version }} origin/main
          git push origin ${{ steps.version.outputs.version }}

      # developへ直接マージ
      - name: Merge to develop
        run: |
          git fetch origin develop
          git checkout develop
          git merge origin/release/${{ steps.version.outputs.version }} --no-ff
          git push origin develop