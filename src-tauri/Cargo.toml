[package]
name = "notyra"
version = "1.5.6"
description = "A lightweight markdown editor"
authors = ["Yuma Shintani <yuma@y-shin.net>"]
edition = "2021"
rust-version = "1.95"

[lib]
name = "notyra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset", "devtools", "image-png"] }
tauri-plugin-fs = "2.7.1"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-store = "2.5.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-opener = "2.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
gray_matter = "0.3.2"
notify = "8.2.1"
parking_lot = "0.13.0"
urlencoding = "2.1.3"
url = "2.5.8"
base64 = "0.23.1"
font-kit = "0.14.3"
zip = { version = "=9.2.0", default-features = false, features = ["deflate"] }
reqwest = { version = "=0.13.2", default-features = false, features = ["json", "rustls", "http2"] }
tauri-plugin-clipboard-manager = "=2.5.0"

[dev-dependencies]
proptest = "=1.12.0"
tempfile = "=3.27.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
